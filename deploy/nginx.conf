# /etc/nginx/sites-available/faceattend
# Сертификат выпускает setup-server.sh: certbot --nginx -d face-attent.zhastunulani.kz

server {
    listen 80;
    listen [::]:80;
    server_name face-attent.zhastunulani.kz;

    # Фото при регистрации сотрудника и check-in (приложение само ограничивает 1.5 МБ на фото)
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:4350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем, а не дополняем: приложение берёт IP клиента для ограничения попыток входа
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Модели face-api (~12 МБ) и статика Nuxt редко меняются
    location ~ ^/(models|_nuxt)/ {
        proxy_pass http://127.0.0.1:4350;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
